<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Starting Soon</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: Arial, sans-serif; padding: 20px; }
    .card { width: min(560px, 100%); padding: 34px; border: 1px solid #334155; border-radius: 22px; background: #1e293b; text-align: center; box-shadow: 0 20px 60px #0005; }
    .icon { font-size: 48px; }
    .muted { color: #94a3b8; line-height: 1.6; }
    .time { font-size: clamp(40px, 10vw, 64px); font-weight: 800; letter-spacing: 2px; margin: 24px 0; color: #93c5fd; font-variant-numeric: tabular-nums; }
    .badge { display: inline-block; padding: 7px 12px; border-radius: 30px; background: #1e3a8a; color: #bfdbfe; font-weight: 700; font-size: 12px; }
    a { display: inline-block; margin-top: 18px; padding: 12px 18px; border-radius: 10px; background: #334155; color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">⏳</div>
    <span class="badge">UPCOMING QUIZ</span>
    <h1>{{ quiz.title }}</h1>
    <p class="muted">The quiz has not started yet. Please stay on this page.</p>
    <div class="time" id="countdown">--:--:--</div>
    <p class="muted">The quiz will become available automatically when the countdown reaches zero.</p>
    <a href="{{ url_for('student.available_quizzes') }}">Back to Available Quizzes</a>
  </main>

  <script>
    (function () {
      "use strict";

      const target = new Date({{ start_time.isoformat()|tojson if start_time else "null" }});
      const display = document.getElementById("countdown");

      function tick() {
        if (!target || Number.isNaN(target.getTime())) {
          display.textContent = "Check schedule";
          return;
        }

        const ms = target.getTime() - Date.now();
        if (ms <= 0) {
          display.textContent = "00:00:00";
          window.location.reload();
          return;
        }

        const total = Math.floor(ms / 1000);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const sec = total % 60;

        display.textContent = [h, m, sec].map(n => String(n).padStart(2, "0")).join(":");
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
