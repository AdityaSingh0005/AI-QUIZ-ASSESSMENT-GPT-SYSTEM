<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Join Quiz</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e1b4b
                );

            color: white;
        }

        .card {

            width: 100%;

            max-width: 460px;

            padding: 35px;

            border-radius: 24px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 25px 70px
                rgba(
                    0,
                    0,
                    0,
                    0.4
                );
        }

        .icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 20px;

            font-size: 32px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );
        }

        h1 {

            margin: 0;

            text-align: center;

            font-size: 28px;
        }

        .quiz-title {

            margin-top: 10px;

            text-align: center;

            color: #cbd5e1;

            font-size: 16px;

            line-height: 1.5;
        }

        .info {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin:
                25px 0;
        }

        .info-box {

            padding: 14px;

            border-radius: 14px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

            text-align: center;
        }

        .info-box strong {

            display: block;

            font-size: 18px;

            margin-bottom: 5px;
        }

        .info-box span {

            color: #94a3b8;

            font-size: 12px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #e2e8f0;

            font-size: 14px;

            font-weight: 600;
        }

        input {

            width: 100%;

            padding: 14px 15px;

            margin-bottom: 18px;

            border: 1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            border-radius: 12px;

            outline: none;

            color: white;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.2
                );

            font-size: 15px;
        }

        input:focus {

            border-color: #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(
                    99,
                    102,
                    241,
                    0.15
                );
        }

        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 13px;

            cursor: pointer;

            color: white;

            font-size: 16px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            transition:
                transform .2s,
                box-shadow .2s;
        }

        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(
                    37,
                    99,
                    235,
                    0.35
                );
        }

        .error {

            padding: 12px;

            margin-bottom: 18px;

            border-radius: 10px;

            color: #fecaca;

            background:
                rgba(
                    239,
                    68,
                    68,
                    0.12
                );

            border:
                1px solid
                rgba(
                    239,
                    68,
                    68,
                    0.25
                );

            font-size: 14px;
        }

        .note {

            margin-top: 18px;

            text-align: center;

            color: #64748b;

            font-size: 12px;

            line-height: 1.5;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">
            📝
        </div>

        <h1>
            Join Quiz
        </h1>

        <div class="quiz-title">

            {{ quiz.title }}

        </div>

        <div class="info">

            <div class="info-box">

                <strong>
                    {{ quiz.total_questions }}
                </strong>

                <span>
                    Questions
                </span>

            </div>

            <div class="info-box">

                <strong>
                    {{ quiz.duration_minutes }} min
                </strong>

                <span>
                    Duration
                </span>

            </div>

        </div>

        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}

        <form
            method="POST"
            action="{{ url_for('student.guest_start_quiz', quiz_id=quiz.quiz_id) }}"
        >

            <label>
                Student Name
            </label>

            <input
                type="text"
                name="student_name"
                placeholder="Enter your full name"
                required
                autocomplete="name"
            >

            <label>
                Roll Number
            </label>

            <input
                type="text"
                name="roll_number"
                placeholder="Enter your roll number"
                required
                autocomplete="off"
            >

            <button type="submit">
                🚀 Start Quiz
            </button>

        </form>

        <div class="note">

            Enter your correct name and roll number
            before starting the quiz.

        </div>

    </div>

</body>

</html>
